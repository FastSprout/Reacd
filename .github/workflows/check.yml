name: Check

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_call:

permissions:
  contents: read

env:
  NODE_VERSION: '22.23.4'
  DOCS_ARTIFACT_RETENTION_DAYS: '14'
  CHECK_ARTIFACT_RETENTION_DAYS: '14'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run check
      - name: Preserve failed check diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: failed-checks-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
            coverage/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: ${{ env.CHECK_ARTIFACT_RETENTION_DAYS }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: docs-${{ github.sha }}
          path: site/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: ${{ env.DOCS_ARTIFACT_RETENTION_DAYS }}

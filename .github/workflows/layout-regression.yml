name: Native layout regression

on:
  push:
    branches:
      - release/0.3.1-layout

permissions:
  contents: read

concurrency:
  group: layout-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run policy
      - run: npm run lint:layers
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: >-
          npm run test:browser -- --project=shadcn --workers=1
          --reporter=list,html,github
          page-navigation.spec.ts workbench.spec.ts
          --grep='Compact page navigation 240px|contains long text at 240px'
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-layout-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
  prepare:
    needs: layout
    if: >-
      github.repository == 'FastSprout/Reacd' &&
      github.ref == 'refs/heads/release/0.3.1-layout'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          skip-github-release: true
      - name: Include the verified native layout corrections
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=release-please--branches--main--components--reacd
          gh pr view "$branch" --json title,body > /tmp/reacd-release-pr.json
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const pr = JSON.parse(readFileSync('/tmp/reacd-release-pr.json', 'utf8'));
          if (!pr || pr.title !== 'chore(main): release 0.3.1' ||
            typeof pr.body !== 'string') throw Error('Unexpected release PR.');
          const heading = '### Bug Fixes\n';
          if (!pr.body.includes(heading)) throw Error('Missing release notes.');
          const notes = [
            '* Keep native checkbox labels inside narrow fields.',
            '* Constrain native page navigation wrappers in both directions.',
          ].join('\n') + '\n';
          writeFileSync('/tmp/reacd-release-notes.md',
            pr.body.replace(heading, heading + '\n' + notes));
          JS
          gh pr edit "$branch" --body-file /tmp/reacd-release-notes.md

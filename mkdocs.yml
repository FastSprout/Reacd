site_name: reacd
site_description: High-level React UI with closed components and theme adapters
site_url: https://reacd.dev/
docs_dir: docs
site_dir: site
exclude_docs: |
  examples/*.test.tsx
  examples/tsconfig.json
strict: true
dev_addr: 127.0.0.1:8000
theme:
  name: shadcn
  custom_dir: tooling/docs-preview/theme
plugins:
  - search:
      lang: en
markdown_extensions:
  - admonition
  - fenced_code
  - tables
  - pymdownx.snippets:
      base_path: docs
      check_paths: true
  - toc:
      permalink: true
nav:
